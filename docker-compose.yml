name: shorted

services:
  server:
    build:
      context: ./server
    container_name: shorted-server
    ports:
      - "8080:8080"
    environment:
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: shorted-client
    ports:
      - "3000:3000"
    depends_on:
      - server
